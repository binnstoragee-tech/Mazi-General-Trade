<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Staff Orders — MAZI General Trade</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#0F3A2E; --green-800:#164B3B; --green-700:#1C5E48; --green-600:#237259; --green-100:#E4F0EA;
  --cream:#F8F7F2; --white:#fff; --ink:#16211C; --ink-soft:#5C6B63; --line:#E6E4DC;
  --red:#D5473C; --red-bg:#FBE7E5; --amber:#B7791F; --amber-bg:#FFF4DC; --blue:#2B6CB0; --blue-bg:#E6F0FB;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Montserrat',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.45;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--white);border:1px solid var(--line);padding:28px 24px;width:100%;max-width:380px}
.login-card img{height:38px;display:block;margin:0 auto 14px}
.login-card h1{font-size:18px;margin:0 0 4px;text-align:center}
.login-card p{margin:0 0 18px;color:var(--ink-soft);text-align:center;font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);background:#fff;border-radius:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--green-500,#2E8C6C);outline-offset:-1px}
.btn{border:0;background:var(--green-800);color:#fff;padding:11px 16px;font-weight:700;cursor:pointer;border-radius:0}
.btn:hover{background:var(--green-700)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--green-800);border:1px solid var(--green-800)}
.btn.ghost:hover{background:var(--green-100)}
.btn.danger{background:var(--red)}
.btn.small{padding:7px 11px;font-size:12px}
.btn.full{width:100%}
.err{color:var(--red);font-size:12.5px;margin:8px 0 0;min-height:18px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--green-900);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.bar h1{font-size:15px;margin:0;flex:1}
.bar .who{font-size:11.5px;opacity:.7;display:none}
.bar .btn{background:rgba(255,255,255,.12)}
.bar .btn:hover{background:rgba(255,255,255,.22)}
@media(min-width:640px){.bar .who{display:block}}

.wrap{max-width:900px;margin:0 auto;padding:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex:1 1 100%}
.tab{border:1px solid var(--line);background:#fff;padding:7px 12px;white-space:nowrap;cursor:pointer;font-weight:500;font-size:12.5px}
.tab.active{background:var(--green-800);border-color:var(--green-800);color:#fff}
.tab .n{opacity:.7;margin-left:4px}
.search{flex:1 1 200px;padding:9px 12px;border:1px solid var(--line);background:#fff}
.meta{font-size:12px;color:var(--ink-soft);margin:2px 0 10px}

/* order card */
.card{background:#fff;border:1px solid var(--line);margin-bottom:12px}
.card.new{border-left:4px solid var(--green-600)}
.card-head{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;align-items:flex-start}
.card-head .id{font-weight:700;font-size:15px}
.card-head .sub{color:var(--ink-soft);font-size:12px}
.badge{display:inline-block;padding:3px 9px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.b-placed{background:var(--amber-bg);color:var(--amber)}
.b-processing{background:var(--blue-bg);color:var(--blue)}
.b-delivery{background:#EFE6FA;color:#6B46C1}
.b-delivered{background:var(--green-100);color:var(--green-800)}
.b-cancelled{background:var(--red-bg);color:var(--red)}
.card-body{border-top:1px solid var(--line);padding:12px 14px}
.grid{display:grid;gap:14px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.kv.total{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.items{margin:0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.items li small{color:var(--ink-soft);display:block}
.loc{white-space:pre-line}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1;padding:8px 10px;border:1px solid var(--line)}
.note{margin-top:8px;padding:8px 10px;background:var(--cream);font-size:12.5px}
.empty{text-align:center;color:var(--ink-soft);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--green-900);color:#fff;padding:10px 16px;z-index:20;font-size:13px;max-width:90vw}
.toast.error{background:var(--red)}
a{color:var(--green-700)}
</style>
</head>
<body>

<!-- Sign in -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <img src="img/logo-green.png" alt="MAZI">
    <h1>Staff sign in</h1>
    <p>Orders dashboard — staff accounts only.</p>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="btn full" id="loginBtn">Sign in</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<!-- Dashboard -->
<div id="appView" class="hidden">
  <div class="bar">
    <h1>MAZI · Orders</h1>
    <span class="who" id="who"></span>
    <button class="btn small" id="refreshBtn">Refresh</button>
    <button class="btn small" id="logoutBtn">Log out</button>
  </div>
  <div class="wrap">
    <div class="tools">
      <div class="tabs" id="tabs"></div>
      <input class="search" id="search" type="search" placeholder="Search order #, name or mobile">
    </div>
    <div class="meta" id="meta"></div>
    <div id="list"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="api.js"></script>
<script src="admin.js"></script>
</body>
</html>
